[workspace]
members = [
    "shared",
    "crates/rsil-identity",
]
# Parked members (on disk; add back only with a crates.io graph that resolves
# and a real test). Lived hour client is still client/src — next slice.
#   client/                   — PowrushClientBundle; default bin is GPU test
#   server/                   — landlock host; not first hour
#   simulation/               — shamirs-secret-sharing is not on crates.io
#   host/                     — depends on simulation
#   game/                     — no Cargo.toml
#   powrush-divine-module/    — path-deps missing Ra-Thor ra-thor-core

resolver = "2"

[workspace.package]
version = "21.88.0"
edition = "2021"
authors = ["Sherif Samy Botros <info@Rathor.ai>"]
license = "AG-SML-1.1"
repository = "https://github.com/Eternally-Thriving-Grandmasterism/Powrush-MMO"
description = "Powrush-MMO: human game in the Ra-Thor constellation. Lived first hour is the product. Lattice stays in Ra-Thor."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
