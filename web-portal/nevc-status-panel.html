<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEVC Status · Powrush-MMO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; background: #0a0a0c; color: #e4e4e7; }
    .panel { background: #18181b; border: 1px solid #27272a; border-radius: 1rem; }
    .contributor { border-color: #34d399; box-shadow: 0 0 24px rgba(52, 211, 153, 0.15); }
    .label-contributor { color: #34d399; }
    .label-zombie { color: #a1a1aa; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div id="nevc-panel" class="panel p-8 max-w-md w-full">
    <div class="text-xs uppercase tracking-widest text-zinc-500 mb-2">Net Eternal Valence Contribution</div>
    <div id="nevc-label" class="text-2xl font-semibold mb-4 label-zombie">Zombie Partition</div>
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div><div class="text-zinc-500">Score</div><div id="nevc-score" class="text-lg font-mono">0.000</div></div>
      <div><div class="text-zinc-500">Samples</div><div id="nevc-samples" class="text-lg font-mono">0</div></div>
      <div><div class="text-zinc-500">Mean Valence</div><div id="nevc-valence" class="text-lg font-mono">0.000000</div></div>
      <div><div class="text-zinc-500">Total Grief</div><div id="nevc-grief" class="text-lg font-mono">0.000</div></div>
    </div>
    <div class="mt-6 flex items-center justify-between gap-3">
      <label class="text-xs text-zinc-500">Horizon preset</label>
      <select id="nevc-horizon" class="bg-zinc-900 border border-zinc-700 rounded-lg px-3 py-1.5 text-sm">
        <option value="neutral">Neutral</option>
        <option value="forward" selected>Forward emphasis</option>
        <option value="eternal">Eternal tilt</option>
      </select>
    </div>
    <div id="nevc-feed-status" class="mt-3 text-xs text-zinc-600">Feed: idle</div>
    <p class="mt-6 text-xs text-zinc-600 leading-relaxed">
      Binary partition only: <span class="text-emerald-400">Active Eternal Contributor</span>
      or <span class="text-zinc-400">Zombie Partition</span>.
      Finish Pass C: polls <code>../data/nevc_status.json</code> every 5s.
    </p>
  </div>
  <script>
    function setNevcSummary(s) {
      const isContributor = s.class === 'ActiveEternalContributor' || s.label === 'Active Eternal Contributor';
      const panel = document.getElementById('nevc-panel');
      const label = document.getElementById('nevc-label');
      panel.classList.toggle('contributor', isContributor);
      label.textContent = s.label || (isContributor ? 'Active Eternal Contributor' : 'Zombie Partition');
      label.className = 'text-2xl font-semibold mb-4 ' + (isContributor ? 'label-contributor' : 'label-zombie');
      document.getElementById('nevc-score').textContent = Number(s.score ?? 0).toFixed(3);
      document.getElementById('nevc-samples').textContent = String(s.sample_count ?? 0);
      document.getElementById('nevc-valence').textContent = Number(s.mean_valence ?? 0).toFixed(6);
      document.getElementById('nevc-grief').textContent = Number(s.total_grief ?? 0).toFixed(3);
    }
    window.setNevcSummary = setNevcSummary;

    const FEED_URLS = ['../data/nevc_status.json', '/data/nevc_status.json', 'data/nevc_status.json'];
    async function pollFeed() {
      const el = document.getElementById('nevc-feed-status');
      for (const url of FEED_URLS) {
        try {
          const res = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) continue;
          const data = await res.json();
          setNevcSummary(data);
          el.textContent = 'Feed: live · ' + (data.updated_at || url);
          return;
        } catch (_) {}
      }
      el.textContent = 'Feed: offline — demo state shown';
    }
    setNevcSummary({
      class: 'ActiveEternalContributor',
      label: 'Active Eternal Contributor',
      score: 0.42,
      sample_count: 12,
      mean_valence: 0.999999,
      total_grief: 0.01
    });
    pollFeed();
    setInterval(pollFeed, 5000);
  </script>
</body>
</html>
