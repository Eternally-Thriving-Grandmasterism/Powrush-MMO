# client/Cargo.toml
# Powrush-MMO lived first hour
# Contact: info@Rathor.ai

[package]
name = "powrush-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
steam = ["dep:steamworks"]

[dependencies]
# 0.18.1 `default` is the collections `2d` + `3d` + `ui`. Each pulls
# `default_platform`, and that collection includes `wayland`. Listing the
# collections would enable `wayland`. These are the collection members with
# `default_platform` expanded and `wayland` left out. Transitive closure
# matches the published default feature closure minus `wayland` (and minus
# the empty collection names that cannot be enabled without it).
bevy = { version = "0.18", default-features = false, features = [
    "default_app",
    "2d_bevy_render",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "scene",
    "audio",
    "picking",
    "std",
    "android-game-activity",
    "android_shared_stdcxx",
    "bevy_gilrs",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "webgl2",
    "x11",
    "sysinfo_plugin",
] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared = { path = "../shared" }
steamworks = { version = "0.11", optional = true }
