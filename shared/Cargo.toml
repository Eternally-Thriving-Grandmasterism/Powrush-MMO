[package]
name = "shared"
version = "0.1.0"
edition = "2021"
authors = ["Sherif Samy Botros <info@Rathor.ai>"]
description = "Shared protocol, ECS components, RBE primitives, NEVC dual-repo surfaces for Powrush-MMO. Fully mercy-gated, Ra-Thor ONE Organism derived, PATSAGi Council validated."
license = "AG-SML-1.0"
repository = "https://github.com/Eternally-Thriving-Grandmasterism/Powrush-MMO"
readme = "../README.md"
keywords = ["rbe", "mmo", "powrush", "mercy", "patsagi", "ra-thor", "nevc"]
categories = ["game-development", "simulation"]

[lib]
name = "shared"
path = "lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "1.3", optional = true }
snappy = { version = "0.3", optional = true }
# Phase 8 Mode A: path-link Ra-Thor algebra when monorepos are co-located
mercy_tolc_operator_algebra = { path = "../../Ra-Thor/crates/mercy_tolc_operator_algebra", optional = true }

[features]
default = ["protocol"]
protocol = []
full_rbe = []
# Phase 8: use Ra-Thor NEVC substrate directly (Mode A). Off by default = local adapter (Mode B).
nevc_rathor = ["dep:mercy_tolc_operator_algebra"]

[dev-dependencies]

# AG-SML v1.0 | PATSAGi Councils | info@Rathor.ai
# Thunder locked in.
