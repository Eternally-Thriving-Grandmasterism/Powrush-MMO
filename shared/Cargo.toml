[package]
name = "shared"
version = "0.1.0"
edition = "2021"
authors = ["Sherif Samy Botros <info@Rathor.ai>"]
description = "Shared protocol, ECS components, RBE primitives, NEVC dual-repo surfaces for Powrush-MMO."
license = "AG-SML-1.0"
repository = "https://github.com/Eternally-Thriving-Grandmasterism/Powrush-MMO"
readme = "../README.md"
keywords = ["rbe", "mmo", "powrush", "mercy", "patsagi", "ra-thor", "nevc"]
categories = ["game-development", "simulation"]

[lib]
name = "shared"
path = "lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "1.3", optional = true }

[features]
default = ["protocol"]
protocol = []
full_rbe = []
nevc_rathor = []  # declared so cfg is expected; enabling it does not pull Ra-Thor
# Mode A (Ra-Thor NEVC) is a local overlay. Do not path-dep
# ../../Ra-Thor/crates/mercy_tolc_operator_algebra here — CI has no sibling tree.
# When co-located, uncomment a path dep and restore:
#   nevc_rathor = ["dep:mercy_tolc_operator_algebra"]
# Default remains Mode B (shared/nevc_adapter.rs).

[dev-dependencies]
