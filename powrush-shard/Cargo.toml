# Parked crate — NOT a workspace member (see root Cargo.toml comment block).
# Build with: cargo run --manifest-path powrush-shard/Cargo.toml -- --help
# Do NOT wire into default `cargo run -p powrush-client`.
[package]
name = "powrush-shard"
version = "0.1.0"
edition = "2021"
authors = ["Sherif Samy Botros <info@Rathor.ai>"]
license = "AG-SML-1.1"
description = "Hex shard binary: loopback-only WS listen + offline dry-apply. Not default client door."
repository = "https://github.com/Eternally-Thriving-Grandmasterism/Powrush-MMO"
publish = false

[[bin]]
name = "powrush-shard"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared = { path = "../shared" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
