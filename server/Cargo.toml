[package]
name = "powrush-mmo-server"
version = "0.1.0"
edition = "2021"
authors = ["Sherif Samy Botros <info@Rathor.ai>"]
license = "AG-SML-1.0"

[features]
default = []
steam = ["dep:steamworks", "dep:thiserror"]
# Mode A is a local overlay on shared; not a workspace feature until Ra-Thor is co-located.

[dependencies]
bevy = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

shared = { path = "../shared" }

nix = { version = "0.29", features = ["user"] }
caps = "0.5"
sha2 = "0.10"
seccompiler = "0.4"
landlock = "0.4"

steamworks = { version = "0.10", optional = true }
thiserror = { version = "1", optional = true }

[dev-dependencies]
