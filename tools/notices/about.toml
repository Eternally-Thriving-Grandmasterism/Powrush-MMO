# cargo-about 0.9.x (cargo install cargo-about --version "=0.9.3" --locked --features cli).
# Regenerate from the repo root after any Cargo.lock change:
#   cargo about generate --frozen -m client/Cargo.toml -c tools/notices/about.toml tools/notices/about.hbs \
#     -o THIRD-PARTY-NOTICES.txt && sed -i "s/@CARGO_LOCK_SHA256@/$(sha256sum Cargo.lock | cut -c1-64)/" THIRD-PARTY-NOTICES.txt
accepted = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib", "ISC", "MIT-0", "BSD-3-Clause"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# windows-rs crates ship a lowercase license-mit that the scan skips; clarify points at it (checksum-pinned).
windows.clarify = { license = "MIT OR Apache-2.0", files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }] }
windows-collections.clarify = { license = "MIT OR Apache-2.0", files = [{ path = "license-mit", license = "MIT", checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383" }] }
