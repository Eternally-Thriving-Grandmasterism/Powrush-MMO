name: offline-build

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/offline-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: offline-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Bevy Linux deps (alsa, udev, x11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             pkg-config             libasound2-dev             libudev-dev             libx11-dev             libxkbcommon-x11-dev

      - name: Release build (default features)
        run: cargo build --release -p powrush-client

      - name: Package offline dist
        id: package
        shell: bash
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux)
              os=linux
              bin="target/release/powrush-client"
              ;;
            Windows)
              os=windows
              bin="target/release/powrush-client.exe"
              ;;
            *)
              echo "unsupported RUNNER_OS=${RUNNER_OS}" >&2
              exit 1
              ;;
          esac
          if [[ ! -f "${bin}" ]]; then
            echo "release binary missing: ${bin}" >&2
            exit 1
          fi
          sha8="${GITHUB_SHA:0:8}"
          dist="dist/powrush-offline-${os}-${sha8}"
          mkdir -p "${dist}/assets"
          cp -f "${bin}" "${dist}/"
          # Root assets first. client/assets wins on clash
          # (shaders/forgiveness_wave.wgsl, audio/README.md).
          cp -a assets/. "${dist}/assets/"
          cp -a client/assets/. "${dist}/assets/"
          cat > "${dist}/README.txt" << 'EOF'
          Offline build only.
          Online is grey and disabled.
          This is a prototype CI artifact, not a release.
          EOF
          echo "os=${os}" >> "${GITHUB_OUTPUT}"
          echo "sha8=${sha8}" >> "${GITHUB_OUTPUT}"
          echo "dist=${dist}" >> "${GITHUB_OUTPUT}"

      - name: Upload offline artifact
        uses: actions/upload-artifact@v4
        with:
          name: powrush-offline-${{ steps.package.outputs.os }}-${{ steps.package.outputs.sha8 }}
          path: ${{ steps.package.outputs.dist }}
          retention-days: 14
