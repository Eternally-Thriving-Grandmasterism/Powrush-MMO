name: offline-build

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/offline-build.yml"

permissions:
  contents: read

jobs:
  build:
    name: offline-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Bevy Linux deps (alsa, udev, x11)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             pkg-config             libasound2-dev             libudev-dev             libx11-dev             libxkbcommon-x11-dev

      - name: Release build (default features)
        run: cargo build --release -p powrush-client

      - name: Package offline dist
        id: package
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux)
              os=linux
              bin="target/release/powrush-client"
              ;;
            Windows)
              os=windows
              bin="target/release/powrush-client.exe"
              ;;
            *)
              echo "unsupported RUNNER_OS=${RUNNER_OS}" >&2
              exit 1
              ;;
          esac
          if [[ ! -f "${bin}" ]]; then
            echo "release binary missing: ${bin}" >&2
            exit 1
          fi
          sha8="${HEAD_SHA:0:8}"
          dist="dist/powrush-offline-${os}-${sha8}"
          mkdir -p "${dist}/assets"
          if [[ "${os}" == "linux" ]]; then
            # tar from the binary's directory so the archive member is ./powrush-client
            (
              cd "$(dirname "${bin}")" || exit 1
              tar czf "${OLDPWD}/${dist}/powrush-offline-linux-${sha8}.tar.gz" powrush-client
            )
          else
            cp -f "${bin}" "${dist}/"
          fi
          # Root assets first. client/assets wins on clash
          # (shaders/forgiveness_wave.wgsl, audio/README.md).
          cp -a assets/. "${dist}/assets/"
          cp -a client/assets/. "${dist}/assets/"
          cat > "${dist}/README.txt" << 'EOF'
          Offline build only.
          Online is grey and disabled.
          This is a prototype CI artifact, not a release.
          EOF
          cat >> "${dist}/README.txt" << EOF
          Linux: tar xzf powrush-offline-linux-${sha8}.tar.gz, then ./powrush-client (from this folder, next to assets/).
          Windows: run powrush-client.exe (next to assets/).
          Linux needs: libxkbcommon-x11-0 libasound2 libudev1 libvulkan1 and a Vulkan driver (e.g. mesa-vulkan-drivers).
          EOF
          {
            echo "os=${os}"
            echo "sha8=${sha8}"
            echo "dist=${dist}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload offline artifact
        uses: actions/upload-artifact@v4
        with:
          name: powrush-offline-${{ steps.package.outputs.os }}-${{ steps.package.outputs.sha8 }}
          path: ${{ steps.package.outputs.dist }}
          retention-days: 14

      - name: Smoke boot packaged Linux build
        if: runner.os == 'Linux'
        shell: bash
        env:
          DIST: ${{ steps.package.outputs.dist }}
          SHA8: ${{ steps.package.outputs.sha8 }}
        run: |
          set -euo pipefail
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri xvfb
          # Boot a copy. The uploaded dist directory stays the packaged bytes.
          smoke="${RUNNER_TEMP}/smoke"
          rm -rf "${smoke}"
          mkdir -p "${smoke}"
          cp -a "${DIST}/." "${smoke}/"
          tar -xzf "${smoke}/powrush-offline-linux-${SHA8}.tar.gz" -C "${smoke}"
          cd "${smoke}" || exit 1
          set +e
          POWRUSH_NET=off POWRUSH_USER_DIR="$(mktemp -d)" timeout 25 xvfb-run -a ./powrush-client > log 2>&1
          code=$?
          set -e
          echo "smoke exit code: ${code}"
          echo "---- log tail ----"
          tail -n 200 log || true
          if [[ "${code}" -ne 124 ]]; then
            echo "---- full log ----"
            cat log || true
            echo "FAIL: expected exit 124 (still alive at 25s), got ${code}" >&2
            exit 1
          fi
