name: Core first hour

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Bevy Linux deps (alsa, udev, x11)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             pkg-config             libasound2-dev             libudev-dev             libx11-dev             libxkbcommon-x11-dev

      - name: Workspace metadata (no sibling Ra-Thor)
        run: cargo metadata --format-version 1 --no-deps

      - name: Core tests (shared + identity)
        run: cargo test -p shared -p rsil-identity

      - name: Lived-hour client library
        run: cargo test -p powrush-client --lib
