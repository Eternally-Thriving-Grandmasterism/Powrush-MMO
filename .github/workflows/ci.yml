name: CI — Core first hour

on:
  push:
    branches: [ main, feat/*, fix/* ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Real gate. Merge only if this is green.
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Workspace metadata (no sibling Ra-Thor)
        run: cargo metadata --format-version 1 --no-deps > /dev/null

      - name: Core tests (shared + identity)
        run: cargo test -p shared -p rsil-identity

  # Parked until the lived-hour client bin and other members compile.
  # History kept. Enable with workflow_dispatch when a slice earns it.
  parked-workspace:
    name: Parked workspace-wide (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: echo "Parked: cargo fmt, clippy -D warnings --workspace, cargo test --workspace, trunk, docker, cargo-deny."
